about:
  paragraphs:
    - "I am a Ph.D. student in the Department of Industrial and Systems Engineering at <strong>Virginia Tech</strong>, advised by <a href=\"https://www.ise.vt.edu/people/faculty/kong.html\">Prof. James Kong</a>. My research develops machine learning, optimization, and physics-informed modeling methods for engineering systems."
    - "My current work focuses on additive manufacturing, including Tensorized Fourier Neural Operators for transient 3D temperature-field prediction in laser powder bed fusion and quantum-inspired optimization for scan-path planning."
    - "Before joining Virginia Tech, I received my B.Eng. in Intelligent Manufacturing from <strong>City University of Hong Kong</strong>, where I worked on digital twin technologies and structural health monitoring. I also conducted visiting research at <strong>KTH Royal Institute of Technology</strong> on robotic EV-battery remanufacturing and embodied AI."

research_interests:
  - title: "Machine Learning for Additive Manufacturing"
    description: "Data-driven and physics-informed models for temperature-field prediction, process understanding, and decision support in laser powder bed fusion."
  - title: "Optimization and Quantum-Inspired Computing"
    description: "Optimization methods for scan-path planning and engineering design, including permutation-based and quantum-inspired search strategies."
  - title: "Digital Twins and Structural Health Monitoring"
    description: "Sensing, modeling, and diagnostic methods for civil infrastructure and intelligent engineering systems."
  - title: "Robotics and Embodied AI"
    description: "Robotic simulation, learning from demonstrations, and AI methods for real-world manufacturing and remanufacturing systems."

news:
  - period: "May 2026"
    description: "I began working as a Research Assistant at Virginia Tech on neural-operator modeling and scan-path optimization for laser powder bed fusion."
  - period: "August 2025"
    description: "I began my Ph.D. in Industrial and Systems Engineering at Virginia Tech and served as a Graduate Teaching Assistant for ISE 2214."
  - period: "June 2025"
    description: "I received my B.Eng. in Intelligent Manufacturing from City University of Hong Kong with Magna Cum Laude honors."
  - period: "2023"
    description: "Our literature review on digital twin technologies for civil infrastructure was published in the Journal of Infrastructure Intelligence and Resilience."

