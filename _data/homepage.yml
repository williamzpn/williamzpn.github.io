about:
  paragraphs:
    - "I am a first-year Ph.D. student in the Department of Industrial and Systems Engineering at Virginia Tech, advised by Prof. James Kong. My research focuses on applying neural operators to solve partial differential equations (PDEs) in additive manufacturing."
    - "Before joining Virginia Tech, I received my B.Eng. in Systems Engineering from City University of Hong Kong, where I was supervised by Prof. Cheng Liu and focused on structural health monitoring using digital twins. In the summer of 2024, I also conducted research at KTH Royal Institute of Technology under the supervision of Prof. Zhibo Pang, exploring embodied AI for real-world systems."

research_interests:
  - title: "Structural Health Monitoring"
    description: "Monitoring and diagnosis methods for civil infrastructure with an emphasis on reliability, condition awareness, and long-term deployment."
  - title: "Digital Twin Technologies"
    description: "Integrating sensing, modeling, and system representations to support diagnosis, maintenance, and infrastructure management."
  - title: "Data-Driven and Physics-Informed Modeling"
    description: "Combining engineering knowledge with data-centric methods for robust system understanding and decision support."
  - title: "Embodied AI for Engineering Systems"
    description: "Exploring AI methods that interact with real-world systems and support adaptive, resilient engineering workflows."

