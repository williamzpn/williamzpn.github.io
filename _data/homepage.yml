about:
  paragraphs:
    - "I am a first-year Ph.D. student in the Department of Industrial and Systems Engineering at <strong>Virginia Tech</strong>, advised by <a href=\"https://www.ise.vt.edu/people/faculty/kong.html\">Prof. James Kong</a>. My research focuses on applying neural operators to solve partial differential equations (PDEs) in additive manufacturing."
    - "Before joining Virginia Tech, I received my B.Eng. in Systems Engineering from <strong>City University of Hong Kong</strong>, where I was supervised by <a href=\"https://www.cityu.edu.hk/stfprofile/ChengLiu.htm\">Prof. Cheng Liu</a> and focused on structural health monitoring using digital twins. In the summer of 2024, I also conducted research at <strong>KTH Royal Institute of Technology</strong> under the supervision of <a href=\"https://www.kth.se/profile/zhibo\">Prof. Zhibo Pang</a>, exploring embodied AI for real-world systems."

research_interests:
  - title: "Structural Health Monitoring"
    description: "Monitoring and diagnosis methods for civil infrastructure with an emphasis on reliability, condition awareness, and long-term deployment."
  - title: "Digital Twin Technologies"
    description: "Integrating sensing, modeling, and system representations to support diagnosis, maintenance, and infrastructure management."
  - title: "Data-Driven and Physics-Informed Modeling"
    description: "Combining engineering knowledge with data-centric methods for robust system understanding and decision support."
  - title: "Embodied AI for Engineering Systems"
    description: "Exploring AI methods that interact with real-world systems and support adaptive, resilient engineering workflows."

